apiVersion: v1
kind: Pod
metadata:
    name: myapp-pod
    labels:
        app: myapp
        type: front-end
spec:
    containers:
        - name: nginx-container
          image: nginx
        - name: nginx2
          image: nginx
          ports:
            - containerPort: 2026
        - name: redis-container
          image: redis
          ports:
            - containerPort: 6379
