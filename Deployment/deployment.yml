apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment

spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      bali: CP

  template:
    metadata:
      labels:
          bali: CP
    spec:
      containers:
        - name: nginx-container
          image: nginx
